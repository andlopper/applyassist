<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulário de várias etapas de teste</title>
  </head>
  <body>
    <form id="application-form">
      <section id="step-one">
        <label for="full-name">Nome completo</label>
        <input id="full-name" name="fullName" type="text" />
        <button id="continue" type="button">Continuar</button>
      </section>
      <section id="step-two" hidden>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" />
        <button type="submit">Enviar candidatura</button>
      </section>
    </form>
    <script src="/watch-form-actions.js"></script>
    <script src="/multi-step.js"></script>
  </body>
</html>
